<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f1f5f9" />
    <script>
      ;(function () {
        try {
          var lng = localStorage.getItem('i18nextLng')
          if (lng === 'en' || lng === 'vi') {
            document.documentElement.lang = lng
          }
          var t = localStorage.getItem('theme')
          var isDark = false
          if (t === 'light') {
            isDark = false
          } else if (t === 'dark') {
            isDark = true
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          }
          document.documentElement.classList.toggle('dark', isDark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', isDark ? '#0f172a' : '#f1f5f9')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monthly Budget" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Quản lý dự chi hàng tháng — VND, offline PWA" />
    <title>Monthly Budget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
