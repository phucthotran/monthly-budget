<!doctype html>
<html lang="vi">
  <head>
    <script>
      ;(function () {
        try {
          var lng = localStorage.getItem('i18nextLng')
          if (lng === 'en' || lng === 'vi') {
            document.documentElement.lang = lng
          }
          var t = localStorage.getItem('theme')
          if (t === 'light') {
            document.documentElement.classList.remove('dark')
            return
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark')
            return
          }
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monthly Budget" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Quản lý dự chi hàng tháng — VND, offline PWA" />
    <title>Monthly Budget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
